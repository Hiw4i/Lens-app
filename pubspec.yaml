name: lens
description: "Lens photo editor."
publish_to: 'none'
version: 0.1.0-alpha+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.5
  lucide_icons_flutter: ^3.1.14
  animations: ^3.0.0
  fading_edge_scrollview: ^4.1.1
  image_picker: ^1.0.0
  image: ^4.2.0
  gal: ^2.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  google_mlkit_selfie_segmentation: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/lens_filter.frag

  fonts:
  - family: Inter
    fonts:
      - asset: assets/fonts/Inter-VariableFont_wght.ttf
  - family: JetBrainsMono
    fonts:
      - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
  - family: SpaceGrotesk
    fonts:
      - asset: assets/fonts/SpaceGrotesk-VariableFont_wght.ttf
