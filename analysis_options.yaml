include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - lib/shared/data/preferences/shared_preferences_provider.g.dart

# The codebase holds itself to the Flutter team's recommendations plus a
# focused extra set: import hygiene, const-everything-possible, and the
# small footguns (sync work in async, runtimeType in user strings). Rules
# that would fight deliberate patterns are consciously absent — e.g. one-off
# motion durations are audited in `app_durations.dart` and must NOT be
# forced through a lint.
linter:
  rules:
    # Import hygiene: dart first, package second, relative last, sorted.
    directives_ordering: true
    # Const-ness: fewer allocations, cheaper builds.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    # Async hygiene: fire-and-forget must be explicit (`unawaited`).
    unawaited_futures: true
    discarded_futures: false
    # Small footguns.
    avoid_print: true
    no_runtimeType_toString: true
    unnecessary_lambdas: true

    use_super_parameters: true
    # Style consistency with the existing code.
    prefer_final_locals: true
    prefer_single_quotes: true
    always_declare_return_types: true
    annotate_overrides: true
